<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login - Library Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- top navbar -->
  <header class="top-navbar">
    <a href="index.html" class="brand-logo">
      <img src="images/logo.svg" alt="Library Management System" class="site-logo-svg">
    </a>
    <ul class="top-nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="help.html">Help</a></li>
    </ul>
  </header>

  <!-- member login form -->
  <!-- ========================================== -->
    <!-- Main Content Display Area               -->
    <!-- ========================================== -->
    <main class="app-main-content" style="display:flex; align-items:center; justify-content:center; min-height: calc(100vh - 120px);">
    <div class="form-card" style="width: 100%; max-width: 480px;">
      <div style="text-align: center; margin-bottom: 16px;">
        <img src="images/member.svg" alt="Member" style="height: 110px; width: auto; max-width: 140px; display: inline-block;">
      </div>
      <h2 style="font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 24px; text-decoration: underline;">Member Login</h2>
      
      <form action="member-dashboard.html" method="GET">
        <div class="form-group">
          <label class="form-label">Student Registration ID / Email</label>
          <input type="text" class="form-control" placeholder="e.g. ITT/2024/033" required value="ITT/2024/033">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Enter your password" required value="student123">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" style="color: #0284c7; text-decoration: none;" onclick="alert('Please contact the library helpdesk or administration to reset your credentials.'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary-block" style="margin-bottom: 16px;">Sign In</button>

        <p style="text-align: center; font-size: 13.5px; color: #555;">
          Don't have an approved account? <a href="member-register.html" style="font-weight: 700; color: #000; text-decoration: underline;">Register for Approval</a>
        </p>
      </form>
    </div>
  </main>

  <!-- footer -->
  <footer class="wireframe-footer">
    &copy; 2026 Library Management System. All Rights Reserved.
  </footer>

</body>
</html>
