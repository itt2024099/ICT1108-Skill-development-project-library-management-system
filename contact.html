<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Library Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="top-navbar">
    <a href="index.html" class="brand-logo">
      <img src="images/logo.svg" alt="Library Management System" class="site-logo-svg">
    </a>
    <ul class="top-nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="help.html">Help</a></li>
    </ul>
  </header>

  <main class="app-main-content" style="padding: 40px 20px;">
    <div class="form-card" style="max-width: 600px;">
      <h1 style="font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 20px;">Contact University Library Helpdesk</h1>
      <p style="color: #666; font-size: 14px; text-align: center; margin-bottom: 24px;">Have questions regarding borrowed items, overdue penalties, or registration approvals?</p>

      <form onsubmit="event.preventDefault(); alert('Message sent to the library desk. We will get back to you shortly.'); this.reset();">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Student Reg No / Staff ID</label>
          <input type="text" class="form-control" placeholder="e.g. ITT/2024/033" required>
        </div>

        <div class="form-group">
          <label class="form-label">Subject</label>
          <input type="text" class="form-control" placeholder="e.g. Library Card Activation Inquiry" required>
        </div>

        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="Describe your inquiry..." required></textarea>
        </div>

        <button type="submit" class="btn-primary-block">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="wireframe-footer">
    &copy; 2026 Library Management System. All Rights Reserved.
  </footer>

</body>
</html>
