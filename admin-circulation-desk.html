    <main class="app-main-content">
      <h1 class="page-title">Circulation Control Desk</h1>
      <p style="color: #666; margin-bottom: 28px;">Process instant checkout loans and physical book check-ins at the university counter.</p>

      <!-- Two Column Layout: Issue (Left) vs Return (Right) Matching Wireframe -->
      <div style="display: flex; gap: 30px; flex-wrap: wrap; max-width: 950px;">
        
        <!-- Issue a Book Column -->
        <div style="flex: 1; min-width: 320px; border: 1.5px solid #000; border-radius: 12px; padding: 24px; background: #fff;">
          <h3 style="font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 16px; border-bottom: 1px solid #e5e5e5; padding-bottom: 8px;">Issue a book</h3>
          
          <form onsubmit="event.preventDefault(); alert('Book successfully issued to student! Due date recorded.'); this.reset();">
            <div class="form-group">
              <label class="form-label">Student Library Id</label>
              <input type="text" class="form-control" placeholder="e.g. 2222" required>
            </div>

            <div class="form-group">
              <label class="form-label">Book Id / Barcode Accession</label>
              <input type="text" class="form-control" placeholder="e.g. 123456" required>
            </div>

            <div class="form-group">
              <label class="form-label">Issue duration</label>
              <select class="form-control" style="background:#fff;">
                <option>14 days (standard undergraduate)</option>
                <option>28 days (postgraduate / research)</option>
                <option>3 days (overnight reference)</option>
              </select>
            </div>

            <button type="submit" class="btn-table" style="background:#000; color:#fff; width:100%; padding:12px; font-size:14px; margin-top:14px;">Complete issue transaction</button>
          </form>
        </div>

        <!-- Return a Book Column -->
        <div style="flex: 1; min-width: 320px; border: 1.5px solid #000; border-radius: 12px; padding: 24px; background: #fff;">
          <h3 style="font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 16px; border-bottom: 1px solid #e5e5e5; padding-bottom: 8px;">Return a book</h3>
          
          <form onsubmit="event.preventDefault(); alert('Book marked as RETURNED! Database stock updated.\n\n[Waitlist Alert]: Student #0099 is in the reservation queue for this title. Please hold this book at the counter!'); this.reset();">
            <div class="form-group">
              <label class="form-label">Student Library Id</label>
              <input type="text" class="form-control" placeholder="e.g. 2222" required>
            </div>

            <div class="form-group">
              <label class="form-label">Book Id</label>
              <input type="text" class="form-control" placeholder="e.g. 123456" required>
            </div>

            <div class="form-group">
              <label class="form-label">Physical Condition Status</label>
              <input type="text" class="form-control" placeholder="e.g. Good / Undamaged" value="Good (No damages)">
            </div>

            <button type="submit" class="btn-table" style="background:#fff; color:#000; width:100%; padding:12px; font-size:14px; margin-top:14px; border:1.5px solid #000;">Mark As Returned</button>
          </form>
        </div>

      </div>

    </main>
