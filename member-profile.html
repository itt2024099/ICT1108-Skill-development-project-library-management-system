  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="top-navbar">
    <a href="member-dashboard.html" class="brand-logo">
      <img src="images/logo.svg" alt="Library Management System" class="site-logo-svg">
    </a>
    <ul class="top-nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="help.html">Help</a></li>
    </ul>
  </header>

  <div class="app-container">
    <aside class="app-sidebar">
      <ul class="sidebar-menu">
        <li>
          <a href="member-dashboard.html">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
            Dashboard
          </a>
        </li>
        <li>
          <a href="member-search.html">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            Search books
          </a>
        </li>
        <li>
          <a href="member-bookmarks.html">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
            Bookmarks
          </a>
        </li>
        <li>
          <a href="member-borrowed.html">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
            Borrowed books
          </a>
        </li>
        <li>
          <a href="member-profile.html" class="active">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            Your details
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <a href="member-login.html" class="btn-signout">Sign Out</a>
      </div>
    </aside>

    <main class="app-main-content">
      <h1 class="page-title">Your Member Details</h1>

      <div class="form-card" style="max-width: 650px; margin: 0;">
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
          <div class="profile-avatar-box" style="width: 70px; height: 70px;">
            <svg viewBox="0 0 24 24" width="45" height="45" fill="#9ca3af"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <div>
            <h3 style="font-size: 18px; font-weight: 700;">Damith Thakshila</h3>
            <p style="font-size: 13px; color: #666;">Status: <strong style="color: #16a34a;">Verified Member (Active)</strong></p>
          </div>
        </div>

        <form onsubmit="event.preventDefault(); alert('Profile details updated successfully!');">
          <div style="display: flex; gap: 16px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 240px;">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" value="Damith Thakshila" required>
            </div>
            <div class="form-group" style="flex: 1; min-width: 240px;">
              <label class="form-label">Student Registration ID</label>
              <input type="text" class="form-control" value="ITT/2024/033" readonly style="background:#f1f5f9;">
            </div>
          </div>

          <div style="display: flex; gap: 16px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 240px;">
              <label class="form-label">Library Card ID</label>
              <input type="text" class="form-control" value="2222" readonly style="background:#f1f5f9;">
            </div>
            <div class="form-group" style="flex: 1; min-width: 240px;">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" value="damith@rjt.ac.lk" required>
            </div>
          </div>

          <hr style="margin: 20px 0; border: none; border-top: 1px solid #e5e5e5;">
          
          <h4 style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">Change Password</h4>
          <div style="display: flex; gap: 16px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 240px;">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" placeholder="Leave blank to keep current">
            </div>
            <div class="form-group" style="flex: 1; min-width: 240px;">
              <label class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" placeholder="Re-type new password">
            </div>
          </div>

          <button type="submit" class="btn-primary-block" style="margin-top: 10px;">Save Profile Changes</button>
        </form>
      </div>

    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
